name: pilot-release

# The official build of the WinDictate Restricted Pilot package, on a fresh
# GitHub-hosted Windows virtual machine:
#   1. build the package with the release tool (clean commit, pinned SDK,
#      locked restore, unit tests, publish, model check, SBOM, sanitisation,
#      hashes, ZIP);
#   2. test the packaged program on this machine: Windows smoke tests,
#      offline transcription with the bundled engine and model, a network
#      audit of the running program, install / exit / uninstall / reinstall;
#   3. scan the package with Microsoft Defender;
#   4. upload the package, its hash, the verification summary and a signed
#      build-provenance attestation.
# Any failure fails the run: a package from a failed run must not be used.

on:
  push:
    branches: [ restricted-pilot-build ]
    tags: [ 'pilot-v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write       # signed build-provenance attestation
      attestations: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      UI_SMOKE_OUT: ${{ github.workspace }}\ui-smoke-out

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Choose the output folder (outside the repository)
        shell: pwsh
        run: '"PILOT_OUT=$env:RUNNER_TEMP\pilot-out" >> $env:GITHUB_ENV'

      - name: Set up the pinned .NET SDK (global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache the pinned speech model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache
          key: pilot-model-${{ hashFiles('pilot/model.json') }}

      - name: Build the submission package
        shell: pwsh
        run: ./pilot/build-release.ps1 -Output $env:PILOT_OUT

      - name: Locate the package
        id: pkg
        shell: pwsh
        run: |
          $submission = Get-ChildItem $env:PILOT_OUT -Directory -Filter 'WinDictate-Restricted-Pilot-*-Submission' | Select-Object -First 1
          $zip = "$($submission.FullName).zip"
          "submission=$($submission.FullName)" >> $env:GITHUB_OUTPUT
          "runtime=$($submission.FullName)\01-Runtime\win-x64" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$($submission.Name)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force $env:UI_SMOKE_OUT | Out-Null
          "# Windows verification of $($submission.Name)`n`nCommit $env:GITHUB_SHA, run $env:GITHUB_RUN_ID on $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version).`n" |
            Set-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"

      - name: Synthesise test speech (invented words)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $wav = Join-Path $env:RUNNER_TEMP 'pilot-speech.wav'
          $synth.SetOutputToWaveFile($wav, $format)
          $synth.Rate = -1
          $synth.Speak('Please send the quarterly report to the finance team by Friday.')
          $synth.Dispose()
          "Voice: $((New-Object System.Speech.Synthesis.SpeechSynthesizer).Voice.Name), $((Get-Item $wav).Length) bytes"

      - name: Windows smoke tests and offline transcription with the packaged engine and model
        shell: pwsh
        env:
          PILOT_RUNTIME_DIR: ${{ steps.pkg.outputs.runtime }}
        run: |
          $env:PILOT_SPEECH_WAV = Join-Path $env:RUNNER_TEMP 'pilot-speech.wav'
          dotnet test tests/WinDictate.UiSmoke/WinDictate.UiSmoke.csproj -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Windows smoke tests failed' }
          "## Windows tests`n`n" + ((Get-Content "$env:UI_SMOKE_OUT\notes.txt" -ErrorAction SilentlyContinue | ForEach-Object { "- $_" }) -join "`n") + "`n" |
            Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"

      - name: Network audit and footprint of the running program
        shell: pwsh
        env:
          RUNTIME: ${{ steps.pkg.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:LOCALAPPDATA 'WinDictate'
          $log = Join-Path $data 'windictate.log'
          # True when the program's log has a matching line. The log only exists once the
          # program has written its first line, so a missing or busy file means "not yet".
          function Test-LogHas([string] $pattern) {
            try { (Test-Path -LiteralPath $log) -and [bool](Select-String -LiteralPath $log -Pattern $pattern -Quiet) } catch { $false }
          }
          # Started completely: the model is verified and loaded, and the program logged
          # "Ready." (which comes after it starts listening for --exit).
          function Test-Started { (Test-LogHas '\[INFO \] Ready\. ') -and (Test-LogHas 'Loaded model .* verified') }
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          New-Item -ItemType Directory -Force $data | Out-Null
          # This test user has "acknowledged" the pilot notice, so the program starts unattended.
          '{ "NoticeAcknowledged": "1" }' | Set-Content -Encoding utf8 (Join-Path $data 'settings.json')
          auditpol /set /subcategory:"Filtering Platform Connection" /success:enable /failure:enable | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "auditpol could not turn on connection auditing (exit code $LASTEXITCODE)" }
          $tempBefore = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem $env:TEMP -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object { [void] $tempBefore.Add($_.FullName) }
          $start = Get-Date
          $exe = Join-Path $env:RUNTIME 'WinDictate.exe'
          $proc = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline -and -not $proc.HasExited -and -not (Test-Started)) { Start-Sleep 1 }
          if (-not (Test-Started)) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "WinDictate.exe did not start completely (model verified and loaded, then ready); exited: $($proc.HasExited)"
          }
          Start-Sleep 15   # idle, as a user would leave it
          curl.exe -s -o NUL https://example.com   # control: proves the audit records connections
          $exit = Start-Process -FilePath $exe -ArgumentList '--exit' -Wait -PassThru
          if ($exit.ExitCode -ne 0) { throw "--exit returned $($exit.ExitCode)" }
          if (-not $proc.WaitForExit(10000)) { throw 'WinDictate.exe did not exit' }
          Start-Sleep 3
          $events = @()
          try {
            $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 5156, 5157; StartTime = $start } -ErrorAction Stop)
          } catch {
            # No events at all is a result (the control check below then fails); anything else is a fault.
            if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { throw }
          }
          $ours = @($events | Where-Object { $_.Properties[0].Value -eq $proc.Id -or "$($_.Properties[1].Value)" -match 'windictate\.exe' })
          $control = @($events | Where-Object { "$($_.Properties[1].Value)" -match 'curl\.exe' })
          if ($control.Count -eq 0) { throw 'Connection auditing recorded nothing for the control connection: the audit cannot be trusted' }
          if ($ours.Count -gt 0) { $ours | Format-List TimeCreated, Id, Message; throw "WinDictate.exe made $($ours.Count) connection attempt(s)" }
          $files = @(Get-ChildItem -LiteralPath $data -Force | ForEach-Object Name)
          $unexpected = @($files | Where-Object { $_ -notin 'settings.json', 'windictate.log', 'windictate.log.old' })
          if ($unexpected.Count -gt 0) { throw "Unexpected files in the data folder: $($unexpected -join ', ')" }
          $newTemp = @(Get-ChildItem $env:TEMP -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { -not $tempBefore.Contains($_.FullName) } | ForEach-Object FullName)
          $suspect = @($newTemp | Where-Object { $_ -match '\.(wav|pcm|tsv)$' -or $_ -match 'windictate' })
          if ($suspect.Count -gt 0) { throw "Audio, history or WinDictate files appeared in TEMP: $($suspect -join ', ')" }
          $fence = '```'
          $logText = (Get-Content -LiteralPath $log) -join "`n"
          $summary = @(
            '## Network audit', '',
            '- WinDictate.exe started, verified and loaded the model, idled 15 s and exited on --exit (exit code 0).',
            "- Windows Filtering Platform connection events during the run: $($events.Count) in total, $($control.Count) for the control (curl.exe), **$($ours.Count) for WinDictate.exe**.",
            "- Data folder afterwards: $($files -join ', ').",
            "- New files in TEMP during the run: $($newTemp.Count); none audio, history or WinDictate-related.",
            '- The program''s log for the run (no dictated text):', '', $fence, $logText, $fence, '') -join "`n"
          $summary | Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"
          $summary

      - name: Install, exit, uninstall, reinstall
        shell: pwsh
        env:
          SUBMISSION: ${{ steps.pkg.outputs.submission }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Join-Path $env:SUBMISSION '01-Runtime'
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\WinDictate Restricted Pilot'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'WinDictate Restricted Pilot.lnk'
          $data = Join-Path $env:LOCALAPPDATA 'WinDictate'
          $log = Join-Path $data 'windictate.log'
          function Assert($condition, $message) { if (-not $condition) { throw $message } }
          # See the network audit step: a log that does not exist yet means "not yet".
          function Test-LogHas([string] $pattern) {
            try { (Test-Path -LiteralPath $log) -and [bool](Select-String -LiteralPath $log -Pattern $pattern -Quiet) } catch { $false }
          }
          function Test-Started { (Test-LogHas '\[INFO \] Ready\. ') -and (Test-LogHas 'Loaded model .* verified') }
          # Any start-up entry mentioning WinDictate: Run and RunOnce (this user and the
          # machine) and both Startup folders.
          function Get-StartupEntries {
            $found = @()
            foreach ($hive in [Microsoft.Win32.Registry]::CurrentUser, [Microsoft.Win32.Registry]::LocalMachine) {
              foreach ($path in 'Software\Microsoft\Windows\CurrentVersion\Run', 'Software\Microsoft\Windows\CurrentVersion\RunOnce') {
                $key = $hive.OpenSubKey($path)
                if (-not $key) { continue }
                try { foreach ($name in $key.GetValueNames()) { if ("$name $($key.GetValue($name))" -match 'WinDictate') { $found += "$($key.Name)\$name" } } }
                finally { $key.Dispose() }
              }
            }
            foreach ($folder in [Environment]::GetFolderPath('Startup'), [Environment]::GetFolderPath('CommonStartup')) {
              if ($folder -and (Test-Path -LiteralPath $folder)) { $found += @(Get-ChildItem -LiteralPath $folder -Force | Where-Object Name -match 'WinDictate' | ForEach-Object FullName) }
            }
            $found
          }
          $lines = @()
          foreach ($round in 1, 2) {
            # No settings or log from an earlier step or round, so the checks below see only this round's program.
            if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
            $installOut = @(powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $scripts 'Install-WinDictate.ps1'))
            $installCode = $LASTEXITCODE
            $installOut | ForEach-Object { Write-Host $_ }
            Assert ($installCode -eq 0) "install failed (round $round)"
            $checked = @($installOut | Where-Object { $_ -match '^Checked (\d+) program files' }) | Select-Object -First 1
            Assert ($checked -and [int]([regex]::Match($checked, '\d+').Value) -gt 0) "the install did not check the files against SHA256SUMS.txt (round $round)"
            Assert (Test-Path -LiteralPath (Join-Path $dest 'WinDictate.exe')) 'program not installed'
            Assert (Test-Path -LiteralPath (Join-Path $dest 'models\ggml-small.en.bin')) 'model not installed'
            Assert (Test-Path -LiteralPath $shortcut) 'Start Menu shortcut missing'
            $startup = @(Get-StartupEntries)
            Assert ($startup.Count -eq 0) "a start-up entry was created: $($startup -join ', ')"
            New-Item -ItemType Directory -Force $data | Out-Null
            '{ "NoticeAcknowledged": "1" }' | Set-Content -Encoding utf8 (Join-Path $data 'settings.json')
            $proc = Start-Process (Join-Path $dest 'WinDictate.exe') -PassThru
            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $deadline -and -not $proc.HasExited -and -not (Test-Started)) { Start-Sleep 1 }
            if (-not (Test-Started)) {
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
              throw "installed program did not start completely (round $round); exited: $($proc.HasExited)"
            }
            $exit = Start-Process (Join-Path $dest 'WinDictate.exe') -ArgumentList '--exit' -Wait -PassThru
            Assert ($exit.ExitCode -eq 0) "--exit failed (round $round, exit code $($exit.ExitCode))"
            Assert ($proc.WaitForExit(10000)) 'program did not exit'
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $scripts 'Uninstall-WinDictate.ps1')
            Assert ($LASTEXITCODE -eq 0) "uninstall failed (round $round)"
            Assert (-not (Test-Path -LiteralPath $dest)) 'program folder left behind'
            Assert (-not (Test-Path -LiteralPath $shortcut)) 'shortcut left behind'
            Assert (-not (Test-Path -LiteralPath $data)) 'settings and log left behind'
            Assert (-not (Get-Process WinDictate -ErrorAction SilentlyContinue)) 'process still running'
            $startup = @(Get-StartupEntries)
            Assert ($startup.Count -eq 0) "a start-up entry is present after uninstall: $($startup -join ', ')"
            $lines += "- Round ${round}: installed with $([regex]::Match($checked, '\d+').Value) program files checked against SHA256SUMS.txt; started, model verified and loaded, exited on --exit, uninstalled; nothing left behind; no start-up entry (Run and RunOnce keys, Startup folders) at any point."
          }
          ("## Install, uninstall, reinstall`n`n" + ($lines -join "`n") + "`n") | Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"

      - name: Microsoft Defender scan
        shell: pwsh
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          SUBMISSION: ${{ steps.pkg.outputs.submission }}
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $report = Join-Path $env:PILOT_OUT 'MALWARE-SCAN.txt'
          $service = Get-Service WinDefend -ErrorAction SilentlyContinue
          if (-not (Test-Path $mp) -or -not $service -or $service.Status -ne 'Running') {
            $why = if (-not (Test-Path $mp)) { 'MpCmdRun.exe is not installed' } else { "the WinDefend service is $($service.Status)" }
            "Microsoft Defender scan NOT RUN on this build machine: $why. Scan the package with your organisation's endpoint scanner." | Set-Content -Encoding utf8 $report
            "## Malware scan`n`n- **Not run**: Microsoft Defender is not available on this runner ($why). The package must be scanned with the organisation's endpoint scanner.`n" |
              Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"
            Get-Content $report
            return
          }
          # A scan that cannot be trusted is reported as inconclusive (the package is then scanned
          # with the organisation's endpoint scanner, as the staging steps require anyway).
          function Write-Inconclusive([string] $why, [string] $detail) {
            @("Microsoft Defender scan INCONCLUSIVE on this build machine: $why", 'Scan the package with your organisation''s endpoint scanner.', '', $detail) -join "`n" |
              Set-Content -Encoding utf8 $report
            "## Malware scan`n`n- **Inconclusive**: $why The package must be scanned with the organisation's endpoint scanner.`n" |
              Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"
            Get-Content $report
          }
          # The hosted image turns Defender's protection down and excludes the C: and D: drives
          # from scanning, which would make a clean result meaningless. Undo that for this scan.
          $before = Get-MpPreference
          try {
            foreach ($path in @($before.ExclusionPath)) { if ($path) { Remove-MpPreference -ExclusionPath $path } }
            foreach ($ext in @($before.ExclusionExtension)) { if ($ext) { Remove-MpPreference -ExclusionExtension $ext } }
            foreach ($proc in @($before.ExclusionProcess)) { if ($proc) { Remove-MpPreference -ExclusionProcess $proc } }
            Set-MpPreference -DisableArchiveScanning $false -DisableScanningNetworkFiles $false
          } catch {
            Write-Host "Changing Defender's settings failed: $($_.Exception.Message)"
          }
          $after = Get-MpPreference
          if (@($after.ExclusionPath | Where-Object { $_ }).Count -gt 0 -or $after.DisableArchiveScanning) {
            Write-Inconclusive 'the runner''s scan exclusions could not be removed, so a clean result would prove nothing.' "Exclusions still set: [$(@($after.ExclusionPath) -join ', ')]; archive scanning disabled: $($after.DisableArchiveScanning)"
            return
          }
          $update = & $mp -SignatureUpdate 2>&1 | Out-String
          # Control: the industry-standard harmless test file must be detected, or a clean result means nothing.
          # (Assembled at run time so the string never appears in the repository or the source snapshot.)
          $controlDir = Join-Path $env:RUNNER_TEMP 'av-control'
          New-Item -ItemType Directory -Force $controlDir | Out-Null
          $control = Join-Path $controlDir 'control.txt'
          $controlCode = 'none'
          $controlScan = ''
          $controlResult = $null
          try {
            [IO.File]::WriteAllText($control, ('X5O!P%@AP[4\PZX54(P^)7CC)7}' + '$EICAR-STANDARD-ANTIVIRUS-TEST-' + 'FILE!$H+H*'))
          } catch {
            $controlResult = "blocked by real-time protection as it was written ($($_.Exception.GetType().Name))"
          }
          if (-not $controlResult) {
            if (Test-Path $control) {
              $controlScan = & $mp -Scan -ScanType 3 -File $control -DisableRemediation 2>&1 | Out-String
              $controlCode = $LASTEXITCODE
              if ($controlCode -eq 2) { $controlResult = 'detected by the scan (exit code 2)' }
            } else {
              $controlResult = 'removed by real-time protection as soon as it was written'
            }
          }
          Remove-Item $controlDir -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $controlResult) {
            Write-Inconclusive "Defender did not detect the standard harmless antivirus test file (exit code $controlCode), so a clean result would prove nothing." "Control scan output:`n$($controlScan.Trim())"
            return
          }
          $scanZip = & $mp -Scan -ScanType 3 -File $env:ZIP -DisableRemediation 2>&1 | Out-String
          $zipCode = $LASTEXITCODE
          $scanFolder = & $mp -Scan -ScanType 3 -File $env:SUBMISSION -DisableRemediation 2>&1 | Out-String
          $folderCode = $LASTEXITCODE
          $status = Get-MpComputerStatus | Select-Object AMProductVersion, AMEngineVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated
          @(
            "Microsoft Defender scan of $([IO.Path]::GetFileName($env:ZIP)) (archive contents included) and of the unpacked package",
            "Date: $(Get-Date -Format o)",
            ($status | Format-List | Out-String).Trim(),
            '',
            "Runner exclusions removed before scanning: paths [$(@($before.ExclusionPath) -join ', ')]; archive scanning was disabled: $($before.DisableArchiveScanning), now enabled.",
            "Control: the standard harmless antivirus test file was $controlResult.",
            '', 'Signature update:', $update.Trim(), '',
            "ZIP scan (exit code $zipCode; 0 = no threats):", $scanZip.Trim(), '',
            "Folder scan (exit code $folderCode; 0 = no threats):", $scanFolder.Trim()
          ) -join "`n" | Set-Content -Encoding utf8 $report
          Get-Content $report
          "## Malware scan`n`n- Microsoft Defender, signatures $($status.AntivirusSignatureVersion), with the runner's exclusions removed and archive scanning on. Control file $controlResult. ZIP: exit code $zipCode; unpacked package: exit code $folderCode (0 = no threats).`n" |
            Add-Content -Encoding utf8 "$env:PILOT_OUT\CI-VERIFICATION.md"
          if ($zipCode -ne 0 -or $folderCode -ne 0) { throw 'Defender reported a problem' }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:PILOT_OUT\CI-VERIFICATION.md") { Get-Content "$env:PILOT_OUT\CI-VERIFICATION.md" | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Upload the submission package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
            ${{ env.PILOT_OUT }}\CI-VERIFICATION.md
            ${{ env.PILOT_OUT }}\MALWARE-SCAN.txt
          compression-level: 0
          retention-days: 90

      - name: Upload test pictures and notes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-windows-test-output
          path: ${{ env.UI_SMOKE_OUT }}
          if-no-files-found: warn
          retention-days: 30
